
<p-toast key="tst"></p-toast>
<p-confirmDialog></p-confirmDialog>


<!-- =========================================
     PRODUCT MASTER
     Oracle / Microsoft Dynamics Style
     ========================================= -->

<div class="card erp-table-card">

    <p-table
        #dt1

        styleClass="erp-table"

        [value]="mainList()"

        [globalFilterFields]="[
            'name',
            'unit_name',
            'purchase_price',
            'sale_price',
            'stock'
        ]"

        dataKey="id"

        [tableStyle]="{ 'min-width': '65rem' }"

        [rows]="20"

        [paginator]="true"

        [rowsPerPageOptions]="[10,20,50,100]"

        [loading]="loading()"

        [showCurrentPageReport]="true"

        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products">


        <!-- =========================================
             TOOLBAR
             ========================================= -->

        <ng-template #caption>

            <div class="erp-toolbar">

                <!-- Title -->
                <div class="erp-title">

                    <i class="pi pi-box"></i>

                    <span>
                        Product Master
                    </span>

                </div>


                <!-- Right -->
                <div class="erp-toolbar-right">


                    <!-- Search -->
                    <p-iconfield iconPosition="left">

                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>

                        <input
                            pInputText
                            type="text"

                            class="erp-search"

                            (input)="
                                dt1.filterGlobal(
                                    $any($event.target).value,
                                    'contains'
                                )
                            "

                            placeholder="Search products..." />

                    </p-iconfield>


                    <!-- Add Product -->
                    <button
                        pButton
                        type="button"

                        icon="pi pi-plus"

                        label="New Product"

                        (click)="add()">

                    </button>

                </div>

            </div>

        </ng-template>


        <!-- =========================================
             HEADER
             ========================================= -->

        <ng-template #header>

            <tr>


                <!-- Product -->
                <th
                    pSortableColumn="name"
                    style="width: 32%">

                    <div class="erp-header-cell">

                        Product

                        <p-sortIcon
                            field="name">
                        </p-sortIcon>

                    </div>

                </th>


                <!-- Unit -->
                <th
                    pSortableColumn="unit_name"
                    style="width: 13%">

                    <div class="erp-header-cell">

                        Unit

                        <p-sortIcon
                            field="unit_name">
                        </p-sortIcon>

                    </div>

                </th>


                <!-- Purchase Price -->
                <th
                    pSortableColumn="purchase_price"
                    style="width: 16%"
                    class="text-right">

                    <div class="erp-header-cell justify-end">

                        Purchase Price

                        <p-sortIcon
                            field="purchase_price">
                        </p-sortIcon>

                    </div>

                </th>


                <!-- Sale Price -->
                <th
                    pSortableColumn="sale_price"
                    style="width: 16%"
                    class="text-right">

                    <div class="erp-header-cell justify-end">

                        Sale Price

                        <p-sortIcon
                            field="sale_price">
                        </p-sortIcon>

                    </div>

                </th>


                <!-- Stock -->
                <th
                    pSortableColumn="stock"
                    style="width: 13%"
                    class="text-right">

                    <div class="erp-header-cell justify-end">

                        Stock

                        <p-sortIcon
                            field="stock">
                        </p-sortIcon>

                    </div>

                </th>


                <!-- Actions -->
                <th
                    style="width: 10%"
                    class="text-center">

                    Action

                </th>

            </tr>

        </ng-template>


        <!-- =========================================
             BODY
             ========================================= -->

        <ng-template #body let-row>

            <tr>


                <!-- Product Name -->
                <td>

                    <span class="erp-invoice-number">

                        {{ row.name }}

                    </span>

                </td>


                <!-- Unit -->
                <td>

                    {{ row.unit_name || '—' }}

                </td>


                <!-- Purchase -->
                <td class="erp-number">

                    {{ row.purchase_price | number:'1.2-2' }}

                </td>


                <!-- Sale -->
                <td class="erp-number">

                    <span class="erp-balance">

                        {{ row.sale_price | number:'1.2-2' }}

                    </span>

                </td>


                <!-- Stock -->
                <td class="erp-number">

                    {{ row.stock | number:'1.2-2' }}

                </td>


                <!-- Actions -->
                <td>

                    <div class="erp-actions">


                        <!-- Edit -->
                        <button
                            pButton
                            type="button"

                            icon="pi pi-pencil"

                            class="erp-action-btn"

                            pTooltip="Edit Product"

                            tooltipPosition="top"

                            (click)="edit(row.id)">

                        </button>


                        <!-- Delete -->
                        <button
                            pButton
                            type="button"

                            icon="pi pi-trash"

                            class="erp-action-btn erp-delete"

                            pTooltip="Delete Product"

                            tooltipPosition="top"

                            (click)="delete(row.id)">

                        </button>

                    </div>

                </td>

            </tr>

        </ng-template>


        <!-- =========================================
             EMPTY
             ========================================= -->

        <ng-template #emptymessage>

            <tr>

                <td
                    colspan="6"
                    class="erp-empty">

                    <i class="pi pi-box"></i>

                    No products found.

                </td>

            </tr>

        </ng-template>


    </p-table>

</div>
